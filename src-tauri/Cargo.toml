[package]
name = "claude-history"
version = "0.1.0"
description = "Offline viewer for Claude Code and Claude desktop session history"
edition = "2021"
repository = "https://github.com/puIad/claude-history"
homepage = "https://github.com/puIad/claude-history"
keywords = ["claude", "transcript", "archive", "tauri", "history"]
categories = ["gui"]
default-run = "claude-history"

[[bin]]
name = "claude-history"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rayon = "1"
dirs = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
